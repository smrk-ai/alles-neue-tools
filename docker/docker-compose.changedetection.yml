# changedetection.io — Web Change Monitor
#
# Start:  docker compose -f docker/docker-compose.changedetection.yml up -d
# Stop:   docker compose -f docker/docker-compose.changedetection.yml down
# UI:     http://localhost:5000
#
# Nach dem Start:
# 1. http://localhost:5000 oeffnen
# 2. Settings → API → API Key notieren (fuer .env CHANGEDETECTION_API_KEY)
# 3. "Add Watch" fuer jede URL (siehe src/changedetection/config.ts)
# 4. Fetch Backend auf "Playwright Chromium/Chrome" setzen (fuer JS-Seiten)
# 5. Watch UUID aus URL kopieren → in config.ts eintragen

services:
  changedetection:
    # Gepinnt: :latest wurde sonst bei jedem "docker compose pull" still ausgetauscht.
    # 0.60.6 (Release vom 2026-09-14) ist der neueste Versions-Tag; davor stand
    # hier 0.55.8 vom 2026-08-30.
    # Der Digest ist bewusst nicht mitgepinnt — er liesse sich hier nicht
    # verifizieren. Vor dem naechsten Start einmal "docker compose pull" laufen
    # lassen und die UI kurz gegenchecken.
    # Aktualisieren: neuen Tag unter
    # https://github.com/dgtlmoon/changedetection.io/releases waehlen und hier eintragen.
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.6
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - changedetection-data:/datastore
    environment:
      # Playwright Browser fuer JS-gerenderte Seiten (TripAdvisor, Booking, Foody)
      - PLAYWRIGHT_DRIVER_URL=ws://browser-chrome:3000
      - BASE_URL=http://localhost:5000
    depends_on:
      browser-chrome:
        condition: service_started

  # Headless Browser fuer JavaScript-Rendering
  browser-chrome:
    # Per Digest gepinnt statt per Tag: der neueste Versions-Tag dieses Images ist
    # 0.0.3 von 2025-08-20, waehrend :latest zuletzt am 2026-08-26 neu gebaut wurde.
    # Ein Pin auf 0.0.3 wuerde also ein Jahr Fixes zuruecknehmen; der Digest haelt
    # genau den Stand fest, der aktuell hinter :latest steht (linux/amd64, linux/arm64).
    # Aktualisieren: docker pull dgtlmoon/sockpuppetbrowser:latest, dann
    # docker inspect --format='{{index .RepoDigests 0}}' dgtlmoon/sockpuppetbrowser:latest
    image: dgtlmoon/sockpuppetbrowser@sha256:f166a963b550c29af465c2fac518212e7e3a75f14f0d2b840cf4b79677295764
    container_name: browser-chrome
    hostname: browser-chrome
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=5

volumes:
  changedetection-data:
